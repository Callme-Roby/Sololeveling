name: Build Android Debug APK (local)

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'claude/react-llm-app-ONMbK'
    paths:
      - '.github/workflows/build-android-local.yml'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.js'
      - 'tsconfig.json'
      - 'src/**'
      - 'App.tsx'
      - 'index.ts'
      - 'eas.json'
      - 'BUILD_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate placeholder assets
        run: |
          mkdir -p assets
          convert -size 1024x1024 xc:'#0b0f17' assets/icon.png
          convert -size 1024x1024 xc:'#0b0f17' assets/adaptive-icon.png
          convert -size 1284x2778 xc:'#0b0f17' assets/splash.png
          convert -size 64x64 xc:'#0b0f17' assets/favicon.png
          ls -la assets/

      - name: Expo prebuild (android only)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Gradle assembleDebug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "Found: $APK"
          cp "$APK" sololeveling-debug.apk
          ls -lh sololeveling-debug.apk
          echo "path=sololeveling-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sololeveling-debug-apk
          path: sololeveling-debug.apk
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sololeveling-debug.apk
          generate_release_notes: true
          name: ${{ github.ref_name }} (preview)
          body: |
            APK debug Sololeveling, sideloadable.

            - SDK Expo 51, React Native 0.74
            - Build via `./gradlew assembleDebug` sur GitHub Actions (sans EAS)
            - Signe avec la cle debug Android (Settings -> Security -> Allow installs from unknown sources)
