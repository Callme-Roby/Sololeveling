name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production-apk

permissions:
  contents: write

jobs:
  build:
    name: Build APK with EAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build APK (non-interactive, wait until done)
        id: build
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --no-wait=false \
            --json > build.json
          ARTIFACT_URL=$(node -e "const b=require('./build.json'); console.log(b[0].artifacts.buildUrl)")
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: |
          curl -L -o sololeveling.apk "${{ steps.build.outputs.artifact_url }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sololeveling-apk
          path: sololeveling.apk

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sololeveling.apk
          generate_release_notes: true
